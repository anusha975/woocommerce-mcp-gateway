{{- if .Values.dashboard.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "woocommerce-mcp.dashboard.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "woocommerce-mcp.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
    app.kubernetes.io/name: {{ include "woocommerce-mcp.dashboard.fullname" . }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/component: dashboard
    app.kubernetes.io/name: {{ include "woocommerce-mcp.dashboard.fullname" . }}
{{- end }}
