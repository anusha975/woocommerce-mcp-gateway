{{- if .Values.database.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "woocommerce-mcp.database.serviceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "woocommerce-mcp.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
    app.kubernetes.io/name: {{ include "woocommerce-mcp.database.fullname" . }}
spec:
  type: ClusterIP
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
      protocol: TCP
  selector:
    app.kubernetes.io/component: database
    app.kubernetes.io/name: {{ include "woocommerce-mcp.database.fullname" . }}
{{- end }}
