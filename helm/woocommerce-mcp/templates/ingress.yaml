{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "woocommerce-mcp.fullname" . }}-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "woocommerce-mcp.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName | quote }}
    {{- end }}
  {{- end }}
  rules:
    # 1. Storefront Rule (WordPress / WooCommerce Storefront)
    {{- if .Values.ingress.storefront.enabled }}
    - host: {{ .Values.ingress.storefront.host | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.storefront.path | default "/" | quote }}
            pathType: {{ .Values.ingress.storefront.pathType | default "Prefix" }}
            backend:
              service:
                name: {{ include "woocommerce-mcp.wordpress.serviceName" . }}
                port:
                  number: {{ int .Values.wordpress.service.port }}
    {{- end }}

    # 2. Gateway Rule (MCP Gateway Backend & Interactive UI)
    {{- if .Values.ingress.gateway.enabled }}
    - host: {{ .Values.ingress.gateway.host | quote }}
      http:
        paths:
          {{- if .Values.dashboard.enabled }}
          # When dashboard is active, route MCP endpoints to gateway and UI to dashboard
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: {{ include "woocommerce-mcp.gateway.serviceName" . }}
                port:
                  number: {{ int .Values.gateway.service.port }}
          - path: /sse
            pathType: Prefix
            backend:
              service:
                name: {{ include "woocommerce-mcp.gateway.serviceName" . }}
                port:
                  number: {{ int .Values.gateway.service.port }}
          - path: /messages
            pathType: Prefix
            backend:
              service:
                name: {{ include "woocommerce-mcp.gateway.serviceName" . }}
                port:
                  number: {{ int .Values.gateway.service.port }}
          - path: /healthz
            pathType: Exact
            backend:
              service:
                name: {{ include "woocommerce-mcp.gateway.serviceName" . }}
                port:
                  number: {{ int .Values.gateway.service.port }}
          - path: /readyz
            pathType: Exact
            backend:
              service:
                name: {{ include "woocommerce-mcp.gateway.serviceName" . }}
                port:
                  number: {{ int .Values.gateway.service.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "woocommerce-mcp.dashboard.fullname" . }}
                port:
                  number: 80
          {{- else }}
          # Default: Route all gateway & MCP paths to gateway backend service
          - path: {{ .Values.ingress.gateway.path | default "/" | quote }}
            pathType: {{ .Values.ingress.gateway.pathType | default "Prefix" }}
            backend:
              service:
                name: {{ include "woocommerce-mcp.gateway.serviceName" . }}
                port:
                  number: {{ int .Values.gateway.service.port }}
          {{- end }}
    {{- end }}
{{- end }}
