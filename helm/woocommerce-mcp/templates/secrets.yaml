{{- if and .Values.database.enabled (not .Values.database.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "woocommerce-mcp.database.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "woocommerce-mcp.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: {{ .Values.database.auth.rootPassword | quote }}
  MYSQL_DATABASE: {{ .Values.database.auth.database | quote }}
  MYSQL_USER: {{ .Values.database.auth.username | quote }}
  MYSQL_PASSWORD: {{ .Values.database.auth.password | quote }}
---
{{- end }}
{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "woocommerce-mcp.credentials.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "woocommerce-mcp.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway-credentials
type: Opaque
stringData:
  WOOCOMMERCE_CONSUMER_KEY: {{ .Values.secrets.woocommerceConsumerKey | quote }}
  WOOCOMMERCE_CONSUMER_SECRET: {{ .Values.secrets.woocommerceConsumerSecret | quote }}
  GATEWAY_API_KEY: {{ .Values.secrets.gatewayApiKey | quote }}
{{- end }}
