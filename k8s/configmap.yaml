apiVersion: v1
kind: ConfigMap
metadata:
  name: woocommerce-mcp-gateway-config
  labels:
    app.kubernetes.io/name: woocommerce-mcp-gateway
    app.kubernetes.io/part-of: mcp-gateway
    app.kubernetes.io/component: gateway
data:
  NODE_ENV: "production"
  PORT: "3000"
  HOST: "0.0.0.0"
  LOG_LEVEL: "info"
  WOOCOMMERCE_BASE_URL: "https://your-store.example.com"
  WOOCOMMERCE_TIMEOUT_MS: "10000"
  WOOCOMMERCE_VERIFY_SSL: "true"
  RATE_LIMIT_WINDOW_MS: "60000"
  RATE_LIMIT_MAX_REQUESTS: "100"
  CORS_ALLOWED_ORIGINS: "*"
  MAX_REQUEST_BODY_BYTES: "1048576"
