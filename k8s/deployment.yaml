apiVersion: apps/v1
kind: Deployment
metadata:
  name: woocommerce-mcp-gateway
  namespace: woocommerce-mcp
  labels:
    app.kubernetes.io/name: woocommerce-mcp-gateway
    app.kubernetes.io/part-of: mcp-gateway
    app.kubernetes.io/component: gateway
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: woocommerce-mcp-gateway
  template:
    metadata:
      labels:
        app: woocommerce-mcp-gateway
        app.kubernetes.io/name: woocommerce-mcp-gateway
    spec:
      # Explicit container restart policy
      restartPolicy: Always

      # Pod-level security context (strict non-root execution)
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      # Graceful termination period allowing MCP active connection draining
      terminationGracePeriodSeconds: 30

      containers:
        - name: gateway
          image: woocommerce-mcp-gateway:local
          imagePullPolicy: IfNotPresent
          
          # Container-level hardening
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - ALL

          ports:
            - name: http-mcp
              containerPort: 3000
              protocol: TCP

          # Liveness Probe (restarts pod if gateway process becomes unresponsive)
          livenessProbe:
            httpGet:
              path: /healthz
              port: http-mcp
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3

          # Readiness Probe (removes pod from Service traffic if upstream config/health is unready)
          readinessProbe:
            httpGet:
              path: /readyz
              port: http-mcp
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          # Resource boundaries to prevent noisy neighbor / OOM cluster issues
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          # Inject configuration & secrets
          envFrom:
            - configMapRef:
                name: woocommerce-mcp-gateway-config
            - secretRef:
                name: woocommerce-mcp-gateway-secrets

          # Writable volume for temporary system files (/tmp) and persistent application data (/usr/src/app/data)
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
            - name: data-volume
              mountPath: /usr/src/app/data

      volumes:
        - name: tmp-volume
          emptyDir: {}
        - name: data-volume
          persistentVolumeClaim:
            claimName: woocommerce-mcp-gateway-data
