apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: woocommerce-mcp

resources:
  - namespace.yaml
  - configmap.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml

# Note: secret.yaml is generated locally from secret.example.yaml
# and applied separately via `kubectl apply -f k8s/secret.yaml`
# or created with `kubectl create secret generic woocommerce-mcp-gateway-secrets ...`
