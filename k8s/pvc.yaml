apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: woocommerce-mcp-gateway-data
  namespace: woocommerce-mcp
  labels:
    app.kubernetes.io/name: woocommerce-mcp-gateway
    app.kubernetes.io/part-of: mcp-gateway
    app.kubernetes.io/component: gateway
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
