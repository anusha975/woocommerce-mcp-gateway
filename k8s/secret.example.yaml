apiVersion: v1
kind: Secret
metadata:
  name: woocommerce-mcp-gateway-secrets
  namespace: woocommerce-mcp
  labels:
    app.kubernetes.io/name: woocommerce-mcp-gateway
    app.kubernetes.io/part-of: mcp-gateway
    app.kubernetes.io/component: gateway
type: Opaque
# NOTE: Replace the placeholder values below with your actual credentials before applying.
# Copy this file to k8s/secret.yaml (which is ignored by .gitignore to prevent committing secrets).
# Alternatively, create the secret imperatively:
# kubectl create secret generic woocommerce-mcp-gateway-secrets \
#   --namespace=woocommerce-mcp \
#   --from-literal=WOOCOMMERCE_CONSUMER_KEY="ck_..." \
#   --from-literal=WOOCOMMERCE_CONSUMER_SECRET="cs_..." \
#   --from-literal=GATEWAY_API_KEY="your-api-key"
stringData:
  WOOCOMMERCE_CONSUMER_KEY: "ck_your_real_consumer_key_here"
  WOOCOMMERCE_CONSUMER_SECRET: "cs_your_real_consumer_secret_here"
  GATEWAY_API_KEY: "your_secure_random_client_api_key_here"
